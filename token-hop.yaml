version: "1.0"
ssot: "AGENTS.md"

# 타겟 AI 환경별 출력 설정
targets:
  - name: "antigravity"
    output_dir: ".agents"
    enable_skills: true
  - name: "cursor"
    output_dir: ".cursor/rules"
  - name: "claude"
    output_file: "CLAUDE.md"
    skills_dir: ".claude/skills"
  - name: "copilot"
    instructions_dir: ".github/instructions"
    prompts_dir: ".github/prompts"
  - name: "gemini"
    output_file: "GEMINI.md"

# 컨텍스트 한도 및 분할 정책 (Context Optimization)
context_limits:
  max_tokens_per_rule: 400
  max_characters_per_rule: 1800
  auto_decompose: true

# 선택적 생성형 AI 증강 설정 (Deterministic Core Fallback 지원)
ai:
  enabled: false # CLI 실행 시 --ai 플래그 또는 .env 설정으로 활성화
  provider: "gemini" # [gemini | claude | openai | ollama]
  model: "gemini-2.5-pro"
  features:
    semantic_decompose: true    # 대용량 지침의 의미론적 JIT Skill 자동 분해
    auto_trigger_generation: true # 자연어 시맨틱 트리거/설명 자동 생성
    smart_merge_conflict: true  # 3-Way 병합 시 의미론적 충돌 자동 해결
    quality_evaluation: true    # Promptfoo 기반 LLM Rubric 평가
